name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build plugins (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          for plugin in postgresql mongodb redis; do
            cargo build --release --target aarch64-apple-darwin -p dbm-${plugin}-plugin
            cargo build --release --target x86_64-apple-darwin  -p dbm-${plugin}-plugin
            lipo -create -output plugins/${plugin}/${plugin}-plugin \
              target/aarch64-apple-darwin/release/${plugin}-plugin \
              target/x86_64-apple-darwin/release/${plugin}-plugin
          done

      - name: Build plugins (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: sh scripts/build-plugins.sh

      - name: Build plugins (Linux musl static)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          for plugin in postgresql mongodb redis; do
            cargo build --release --target x86_64-unknown-linux-musl -p dbm-${plugin}-plugin
            cp target/x86_64-unknown-linux-musl/release/${plugin}-plugin plugins/${plugin}/${plugin}-plugin
          done

      - name: Install frontend deps
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Database Manager ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
