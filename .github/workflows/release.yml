name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build plugins (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          for plugin in postgresql mongodb redis; do
            cargo build --release --target aarch64-apple-darwin -p dbm-${plugin}-plugin
            cargo build --release --target x86_64-apple-darwin  -p dbm-${plugin}-plugin
            lipo -create -output plugins/${plugin}/${plugin}-plugin \
              target/aarch64-apple-darwin/release/${plugin}-plugin \
              target/x86_64-apple-darwin/release/${plugin}-plugin
          done

      - name: Build plugins (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: sh scripts/build-plugins.sh

      - name: Build plugins (Linux musl static)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl
          for plugin in postgresql mongodb redis; do
            cargo build --release --target x86_64-unknown-linux-musl -p dbm-${plugin}-plugin
            cp target/x86_64-unknown-linux-musl/release/${plugin}-plugin plugins/${plugin}/${plugin}-plugin
          done

      # Build the local `dbm-server` sidecar per target and lay it under
      # `src-tauri/binaries/dbm-server-<triple>[.exe]` where tauri's
      # externalBin auto-resolves it for bundling.
      - name: Build dbm-server (macOS universal)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p src-tauri/binaries
          cargo build --release --target aarch64-apple-darwin -p dbm-server
          cargo build --release --target x86_64-apple-darwin  -p dbm-server
          cp target/aarch64-apple-darwin/release/dbm-server src-tauri/binaries/dbm-server-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/dbm-server  src-tauri/binaries/dbm-server-x86_64-apple-darwin

      - name: Build dbm-server (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cargo build --release --target x86_64-pc-windows-msvc -p dbm-server
          cp target/x86_64-pc-windows-msvc/release/dbm-server.exe src-tauri/binaries/dbm-server-x86_64-pc-windows-msvc.exe

      - name: Build dbm-server (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          mkdir -p src-tauri/binaries
          cargo build --release --target x86_64-unknown-linux-gnu -p dbm-server
          cp target/x86_64-unknown-linux-gnu/release/dbm-server src-tauri/binaries/dbm-server-x86_64-unknown-linux-gnu

      - name: Install frontend deps
        run: pnpm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing material for the auto-updater. Required for the bundle to
          # produce `latest.json` signatures. Set both secrets in repo
          # settings: the private key is the contents of
          # `~/.tauri/dbm-updater.key` and the password is empty by default.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Database Manager ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}
