[package]
name = "database-manager"
version = "0.1.0"
description = "Local database manager with plugin providers"
authors = ["gtrave"]
edition = "2021"

[lib]
name = "database_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
