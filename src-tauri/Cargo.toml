[package]
name = "database-manager"
version = "0.1.0"
description = "Local database manager with plugin providers"
authors = ["gtrave"]
edition = "2021"

[lib]
name = "database_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = ["macos-private-api"] }
tokio = { version = "1", features = ["io-util", "process", "rt-multi-thread", "sync", "time"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
tauri-plugin-window-state = "2.4.1"
window-vibrancy = "0.7.1"
mdns-sd = "0.19.1"
rustls = { version = "0.23.40", features = ["ring"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["LAContext", "LAError"] }
block2 = "0.6"
