[workspace]
resolver = "2"
members = [
    "src-tauri",
    "server",
    "plugins/common-rpc",
    "plugins/postgresql",
    "plugins/mongodb",
    "plugins/redis",
]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
